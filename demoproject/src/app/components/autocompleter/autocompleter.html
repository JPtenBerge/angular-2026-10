<input
	class="input"
	(input)="query.set($event.target.value)"
	(keyup)="autocomplete()"
	(keydown.arrowdown)="next()"
    (keydown.enter)="enter()"
	[value]="query()"
/>

@if (suggestions !== null) {
	<ul>
		@for (suggestion of suggestions; track $index) {
			<li [class.bg-slate-400]="$index === activeSuggestionIndex">{{ suggestion | json }}</li>
		}
	</ul>
}
